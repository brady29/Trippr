name: Daily backup

# Exports the whole graph and copies it to a Cloud Storage bucket, for a
# database GitHub can reach (AuraDB, or a FalkorDB with a public address).
# AuraDB also pauses after 72 hours idle; this daily query keeps it awake.
#
# Production's FalkorDB VM is only reachable inside the VPC, so there the
# backup runs as the trippr-backup Cloud Run Job (node dist/backup.js) on a
# Cloud Scheduler trigger instead; see docs/operations.md. This workflow
# stays skipped unless BACKUP_BUCKET is set.
#
# Repository variables: GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER,
#   GCP_SERVICE_ACCOUNT, BACKUP_BUCKET, DB_DIALECT
# Repository secrets: FALKORDB_URL, or NEO4J_URI / NEO4J_USER / NEO4J_PASSWORD

on:
  schedule:
    - cron: "17 6 * * *" # every day 06:17 UTC
  workflow_dispatch:

jobs:
  export:
    if: vars.BACKUP_BUCKET != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DB_DIALECT: ${{ vars.DB_DIALECT || 'falkordb' }}
      FALKORDB_URL: ${{ secrets.FALKORDB_URL }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USER: ${{ secrets.NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:export backup.json.gz
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud storage cp backup.json.gz "gs://${{ vars.BACKUP_BUCKET }}/trippr-$(date -u +%Y-%m-%d).json.gz"
