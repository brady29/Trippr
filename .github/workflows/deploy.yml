name: Deploy

# Merging to main builds the API image to Artifact Registry and deploys it to
# Cloud Run, then deploys the web app to Vercel. Each job is skipped until its
# configuration exists, so the workflow is safe before the cloud is set up.
#
# Repository variables: GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER,
#   GCP_SERVICE_ACCOUNT, PUBLIC_WEB_URL, WEB_ORIGIN, DEMO_TRIP_ID, DB_DIALECT
# Repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# GCP Secret Manager: trippr-app-jwt-secret, trippr-falkordb-url (or the
#   trippr-neo4j-* secrets), trippr-auth-jwks-url, trippr-auth-issuer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  api:
    name: API to Cloud Run
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION || 'northamerica-northeast2' }}
      IMAGE: ${{ vars.GCP_REGION || 'northamerica-northeast2' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/trippr/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - run: docker build -f apps/api/Dockerfile -t "$IMAGE" .
      - run: docker push "$IMAGE"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy trippr-api \
            --image "$IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --min-instances 0 --max-instances 2 \
            --memory 512Mi \
            --set-env-vars "NODE_ENV=production,DB_DIALECT=${{ vars.DB_DIALECT || 'falkordb' }},PUBLIC_WEB_URL=${{ vars.PUBLIC_WEB_URL }},WEB_ORIGIN=${{ vars.WEB_ORIGIN }},DEMO_TRIP_ID=${{ vars.DEMO_TRIP_ID }}" \
            --set-secrets "APP_JWT_SECRET=trippr-app-jwt-secret:latest,FALKORDB_URL=trippr-falkordb-url:latest,AUTH_JWKS_URL=trippr-auth-jwks-url:latest,AUTH_ISSUER=trippr-auth-issuer:latest"
      - name: Smoke check /health
        run: |
          URL=$(gcloud run services describe trippr-api --region "$REGION" --format 'value(status.url)')
          curl --fail --retry 5 --retry-delay 5 "$URL/health"

  web:
    name: Web to Vercel
    runs-on: ubuntu-latest
    needs: [api]
    if: always() && (needs.api.result == 'success' || needs.api.result == 'skipped')
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
      - uses: pnpm/action-setup@v4
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
      - if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@41.4.1
      - if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN is not set; skipping the web deploy."
