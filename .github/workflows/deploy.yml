name: Deploy

# Merging to main builds the API image to Artifact Registry and deploys it to
# Cloud Run. The API reaches FalkorDB on a private VM through Direct VPC
# egress, and migrates and seeds the database on startup (both idempotent).
# The job is skipped until its configuration exists.
#
# The web app deploys through Vercel's own GitHub integration. The "web" job
# below is only for token-based deploys and stays skipped unless
# VERCEL_TOKEN is set.
#
# Env vars are passed with "##" as the separator, since values (URLs, the inbox email) contain "@" and ",".
# Repository variables: GCP_PROJECT_ID, GCP_REGION, GCP_WORKLOAD_IDENTITY_PROVIDER,
#   GCP_SERVICE_ACCOUNT, PUBLIC_WEB_URL, WEB_ORIGIN, DEMO_TRIP_ID, DB_DIALECT,
#   AUTH_JWKS_URL, AUTH_ISSUER (Clerk; public values)
#   Trip inbox (all optional): INBOX_EMAIL_ADDRESS (the inbound email service's base
#   address), ANTHROPIC_KEY_SECRET and INBOX_WEBHOOK_SECRET_NAME (names of Secret
#   Manager secrets holding the Claude API key and the webhook secret)
#   Error reporting (optional): SENTRY_DSN (the API's Sentry DSN; not a secret)
#   Calendar feeds (optional): PUBLIC_API_URL, only when the API sits behind a custom domain;
#   otherwise feed links use the Cloud Run address requests arrive on. Add it to --set-env-vars to use it.
#   Trip assistant (optional; uses the same Claude key as the inbox): ASSISTANT_ENABLED
#   (true/false kill switch; on by default when the key is set), ASSISTANT_DAILY_LIMIT
#   (questions per member per day, default 30). ASSISTANT_MODEL defaults to claude-opus-5-5.
#   Data load job (optional): CATALOGUE_LOAD_JOB, the name of an existing Cloud Run Job made from this image;
#   its image is updated on each deploy (see docs/data-platform.md and load-catalogue.yml)
#   Semantic search query embedding (optional): CLOUDFLARE_QUERY_EMBEDDING (true to map the Cloudflare Workers AI
#   credentials into the API; without it search matches words only). Requires the Secret Manager secrets
#   trippr-cloudflare-account-id and trippr-cloudflare-api-token to exist in the project: the deploy replaces
#   the whole secret list each time, so mapping a missing secret fails the deploy. Their values are never in the repo.
#   Secret names can be overridden with CLOUDFLARE_ACCOUNT_ID_SECRET and CLOUDFLARE_API_TOKEN_SECRET.
# Repository secrets (optional web job): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   Flight prices (optional): FLIGHT_PRICES_ENABLED (true to show prices in the app; default false),
#   FLIGHT_PRICES_PROVIDER (travelpayouts or demo; default travelpayouts)
#   Telegram bot (optional): TELEGRAM_BOT_TOKEN_SECRET and TELEGRAM_WEBHOOK_SECRET_NAME (names of Secret Manager
#   secrets holding the bot token and the webhook secret), TELEGRAM_BOT_USERNAME (without the @) and
#   TELEGRAM_WEBHOOK_URL (the API's address plus /telegram/webhook; the API registers it on startup).
#   Setup steps: docs/overnight-2026-11-26-spec.md, "Setting up the Telegram bot".
# GCP Secret Manager: trippr-app-jwt-secret, trippr-falkordb-url

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  api:
    name: API to Cloud Run
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      IMAGE: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/trippr/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - run: docker build -f apps/api/Dockerfile -t "$IMAGE" .
      - run: docker push "$IMAGE"
      - name: Deploy to Cloud Run
        env:
          ANTHROPIC_KEY_SECRET: ${{ vars.ANTHROPIC_KEY_SECRET }}
          INBOX_WEBHOOK_SECRET_NAME: ${{ vars.INBOX_WEBHOOK_SECRET_NAME }}
          CLOUDFLARE_QUERY_EMBEDDING: ${{ vars.CLOUDFLARE_QUERY_EMBEDDING }}
          CLOUDFLARE_ACCOUNT_ID_SECRET: ${{ vars.CLOUDFLARE_ACCOUNT_ID_SECRET || 'trippr-cloudflare-account-id' }}
          CLOUDFLARE_API_TOKEN_SECRET: ${{ vars.CLOUDFLARE_API_TOKEN_SECRET || 'trippr-cloudflare-api-token' }}
          TELEGRAM_BOT_TOKEN_SECRET: ${{ vars.TELEGRAM_BOT_TOKEN_SECRET }}
          TELEGRAM_WEBHOOK_SECRET_NAME: ${{ vars.TELEGRAM_WEBHOOK_SECRET_NAME }}
        run: |
          SECRETS="APP_JWT_SECRET=trippr-app-jwt-secret:latest,FALKORDB_URL=trippr-falkordb-url:latest"
          if [ -n "$ANTHROPIC_KEY_SECRET" ]; then SECRETS="$SECRETS,ANTHROPIC_API_KEY=$ANTHROPIC_KEY_SECRET:latest"; fi
          if [ -n "$INBOX_WEBHOOK_SECRET_NAME" ]; then SECRETS="$SECRETS,INBOX_WEBHOOK_SECRET=$INBOX_WEBHOOK_SECRET_NAME:latest"; fi
          if [ "$CLOUDFLARE_QUERY_EMBEDDING" = "true" ]; then SECRETS="$SECRETS,CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID_SECRET:latest,CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN_SECRET:latest"; fi
          # The Telegram bot: both secrets, only once both variables name them (a missing secret would fail the deploy).
          if [ -n "$TELEGRAM_BOT_TOKEN_SECRET" ] && [ -n "$TELEGRAM_WEBHOOK_SECRET_NAME" ]; then SECRETS="$SECRETS,TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN_SECRET:latest,TELEGRAM_WEBHOOK_SECRET=$TELEGRAM_WEBHOOK_SECRET_NAME:latest"; fi
          gcloud run deploy trippr-api \
            --image "$IMAGE" \
            --region "$REGION" \
            --allow-unauthenticated \
            --min-instances 0 --max-instances 1 --timeout 3600 \
            --memory 512Mi \
            --network default --subnet default --vpc-egress private-ranges-only \
            --set-env-vars "^##^NODE_ENV=production##DB_DIALECT=${{ vars.DB_DIALECT || 'falkordb' }}##DB_AUTO_MIGRATE=true##DB_AUTO_SEED=true##PUBLIC_WEB_URL=${{ vars.PUBLIC_WEB_URL }}##WEB_ORIGIN=${{ vars.WEB_ORIGIN }}##DEMO_TRIP_ID=${{ vars.DEMO_TRIP_ID }}##AUTH_JWKS_URL=${{ vars.AUTH_JWKS_URL }}##AUTH_ISSUER=${{ vars.AUTH_ISSUER }}##INBOX_EMAIL_ADDRESS=${{ vars.INBOX_EMAIL_ADDRESS }}##SENTRY_DSN=${{ vars.SENTRY_DSN }}##SENTRY_RELEASE=${{ github.sha }}##ASSISTANT_ENABLED=${{ vars.ASSISTANT_ENABLED }}##ASSISTANT_DAILY_LIMIT=${{ vars.ASSISTANT_DAILY_LIMIT }}##FLIGHT_PRICES_ENABLED=${{ vars.FLIGHT_PRICES_ENABLED || 'false' }}##FLIGHT_PRICES_PROVIDER=${{ vars.FLIGHT_PRICES_PROVIDER || 'travelpayouts' }}##TELEGRAM_BOT_USERNAME=${{ vars.TELEGRAM_BOT_USERNAME }}##TELEGRAM_WEBHOOK_URL=${{ vars.TELEGRAM_WEBHOOK_URL }}" \
            --set-secrets "$SECRETS"
      - name: Update the flight price job's image
        # The daily snapshot job runs the same image. Skipped until the job exists.
        continue-on-error: true
        run: |
          if gcloud run jobs describe trippr-flight-snapshots --region "$REGION" >/dev/null 2>&1; then
            gcloud run jobs update trippr-flight-snapshots --image "$IMAGE" --region "$REGION"
          fi
      - name: Update the data load job's image
        # The load job (docs/data-platform.md) runs the same image with another command. Only an existing job is
        # updated; nothing is created.
        if: vars.CATALOGUE_LOAD_JOB != ''
        run: gcloud run jobs update "${{ vars.CATALOGUE_LOAD_JOB }}" --image "$IMAGE" --region "$REGION"
      - name: Smoke check /health
        run: |
          URL=$(gcloud run services describe trippr-api --region "$REGION" --format 'value(status.url)')
          curl --fail --retry 5 --retry-delay 5 "$URL/health"

  web:
    name: Web to Vercel
    runs-on: ubuntu-latest
    needs: [api]
    if: always() && (needs.api.result == 'success' || needs.api.result == 'skipped')
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        if: env.VERCEL_TOKEN != ''
      - uses: pnpm/action-setup@v6
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v7
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm
      - if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@41.4.1
      - if: env.VERCEL_TOKEN != ''
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - if: env.VERCEL_TOKEN != ''
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - if: env.VERCEL_TOKEN != ''
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN is not set; skipping the web deploy."
