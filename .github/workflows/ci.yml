name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo             ghcr.io/gitleaks/gitleaks:v8.30.1 git . --config .gitleaks.toml --redact --no-banner --verbose

  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  pipeline:
    name: Data pipeline (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pipelines/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Offline: the tests stage and check small checked-in fixtures; nothing is downloaded.
      - run: uv run pytest

  integration:
    name: API integration tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [falkordb, neo4j]
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.1
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      neo4j:
        image: neo4j:5.26-community
        ports: ["7687:7687"]
        env:
          NEO4J_AUTH: neo4j/ci-password-123
    env:
      DB_DIALECT: ${{ matrix.db }}
      FALKORDB_URL: redis://localhost:6379
      NEO4J_URI: neo4j://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Neo4j
        if: matrix.db == 'neo4j'
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/localhost/7687) 2>/dev/null && break
            sleep 2
          done
          sleep 5
      - run: pnpm test:integration

  e2e:
    name: Playwright smoke tests
    # Pinned: Playwright 1.56 has no Chromium build for ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.1
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trippr/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t trippr-api:ci .
