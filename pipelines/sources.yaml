# Source registry. Every source the pipeline reads must have an entry here; the
# pipeline refuses to extract or stage a source that is missing or disabled.
# Re-check each source's terms when it is changed or once a year, and update
# terms_checked_on. See docs/data-platform-spec.md, "Provenance and licences".

sources:
  overture:
    name: Overture Maps Places
    enabled: true
    url: https://docs.overturemaps.org/guides/places/
    access: >-
      Public GeoParquet on AWS S3 (s3://overturemaps-us-west-2/release/<release>/theme=places/type=place/*),
      read anonymously with DuckDB httpfs and a bounding box per city. The current release is read from the
      STAC catalog at https://stac.overturemaps.org/catalog.json ("latest"). No account or key is needed.
    licence: CDLA-Permissive-2.0 AND Apache-2.0 AND CC0-1.0
    licence_detail: >-
      The Places theme is licensed per data provider and each record carries its provider's licence in
      sources[].license: CDLA Permissive 2.0 (Meta, Microsoft, PinMeTo, Krick, RenderSEO, DAC, BrightQuery,
      Birdeye, Uberall, OpenTravel Alliance), Apache 2.0 (Foursquare) and CC0 1.0 (AllThePlaces).
      Places contains no OpenStreetMap data.
    licence_urls:
      - https://cdla.dev/permissive-2-0/
      - https://www.apache.org/licenses/LICENSE-2.0
      - https://creativecommons.org/publicdomain/zero/1.0/
    attribution: >-
      © Overture Maps Foundation, overturemaps.org. Places data from Meta, Microsoft, Foursquare,
      AllThePlaces and other providers under CDLA Permissive 2.0, Apache 2.0 and CC0 1.0.
      Includes data Copyright 2024 Foursquare Labs, Inc. All rights reserved (Apache 2.0).
    terms_checked_on: 2026-11-22
    terms_urls:
      - https://docs.overturemaps.org/attribution/
      - https://docs.overturemaps.org/guides/places/
      - https://docs.overturemaps.org/getting-data/
    allowed_uses:
      - Read, transform and combine with other data (permissive licences; no share-alike)
      - Show places and derived fields in the app with the attribution above
      - Keep raw and staged copies in our own bucket
    notes: >-
      Joining CDLA data with OpenStreetMap can make the result an ODbL derivative database (see the spec);
      that join happens in PR 2. The categories field was removed in September 2026; we use taxonomy.

  foursquare:
    name: Foursquare Open Source Places
    # Enabled 2026-11-22: the owner's Hugging Face account has access to the gated dataset.
    enabled: true
    url: https://docs.foursquare.com/data-products/docs/access-fsq-os-places
    access: >-
      Official routes as of the check date: (1) the Foursquare Places Portal (https://places.foursquare.com/):
      create an account, generate an access token, and read the Iceberg catalog; (2) the Hugging Face dataset
      https://huggingface.co/datasets/foursquare/fsq-os-places, which is gated (log in and accept the
      dataset's conditions, then use a Hugging Face token). The legacy public S3 bucket no longer serves the
      Parquet releases. The extractor reads any Parquet glob given in FSQ_PLACES_PATH (for example
      hf://datasets/foursquare/fsq-os-places/release/dt=2026-11-17/places/parquet/*.parquet with HF_TOKEN set,
      or a local copy).
    licence: Apache-2.0
    licence_urls:
      - https://www.apache.org/licenses/LICENSE-2.0
    attribution: >-
      Foursquare Open Source Places, Copyright 2024 Foursquare Labs, Inc. All rights reserved.
      Licensed under the Apache License, Version 2.0.
    terms_checked_on: 2026-11-22
    terms_urls:
      - https://docs.foursquare.com/data-products/docs/access-fsq-os-places
      - https://huggingface.co/datasets/foursquare/fsq-os-places
      - https://docs.foursquare.com/data-products/docs/places-os-data-schema
    allowed_uses:
      - Read, transform and combine with other data (Apache 2.0; keep the copyright and licence notice)
      - Show places and derived fields in the app with the attribution above
      - Keep raw and staged copies in our own bucket
    notes: >-
      Read from the gated Hugging Face dataset (release dt=2026-11-17 by default; FSQ_PLACES_PATH overrides).
      The owner accepted the dataset's gating conditions on their own Hugging Face account; the pipeline
      reads with a token from HF_TOKEN or the Hugging Face CLI login (`hf auth login`). Without a token,
      scheduled runs skip this source with a warning.

  osm:
    name: OpenStreetMap
    enabled: true
    url: https://www.openstreetmap.org/
    access: >-
      Overpass API (https://overpass-api.de/api/interpreter), one bounded query per city (a circle of the
      city's radius), tag filters generated from config/category_map_osm.csv, only features with a name.
      Sequential requests at least 15 s apart after checking /api/status for a free slot, a User-Agent
      that names the app, retries after 30 s or more on 429/504, and every response cached on disk so a
      re-run does not query again. No account or key is needed. A Geofabrik extract is the fallback if the
      pipeline ever runs more often than monthly.
    licence: ODbL-1.0
    licence_detail: >-
      Open Database Licence 1.0. Attribution to OpenStreetMap and its contributors is required, and a
      database derived from OSM data and made public must be offered under the ODbL (share-alike).
    licence_urls:
      - https://opendatacommons.org/licenses/odbl/1-0/
      - https://www.openstreetmap.org/copyright
    attribution: >-
      © OpenStreetMap contributors, available under the Open Database Licence (https://www.openstreetmap.org/copyright).
    terms_checked_on: 2026-11-22
    terms_urls:
      - https://www.openstreetmap.org/copyright
      - https://dev.overpass-api.de/overpass-doc/en/preface/commons.html
      - https://wiki.openstreetmap.org/wiki/Overpass_API
    allowed_uses:
      - Read, transform and combine with other data; OSM-derived fields stay traceable through sources[]
      - Show places and derived fields in the app with the attribution above and a link to the copyright page
      - Keep raw and staged copies in our own bucket (not published as a dataset; if a database derived from OSM is ever published it must be ODbL)
    notes: >-
      Overpass fair use as checked on the date above - about 10,000 queries and 1 GB a day, identify the
      app, cache, no parallel scripts, wait 30 s after 429. The pipeline makes about 108 queries a month.

  wikidata:
    name: Wikidata
    enabled: true
    url: https://www.wikidata.org/
    access: >-
      Wikidata Query Service (https://query.wikidata.org/sparql), one query per city using the
      wikibase:around service for items with coordinates inside the city's circle whose instance-of (P31)
      is one of the classes in config/category_map_wikidata.csv, plus batched VALUES queries for the QIDs
      that OpenStreetMap and Wikivoyage name. Sequential requests at least 5 s apart, a User-Agent that
      names the app and a contact URL, Retry-After honoured on 429, responses cached on disk.
    licence: CC0-1.0
    licence_detail: Wikidata's structured data is released under CC0 1.0 (public domain dedication).
    licence_urls:
      - https://creativecommons.org/publicdomain/zero/1.0/
      - https://www.wikidata.org/wiki/Wikidata:Licensing
    attribution: Wikidata (wikidata.org), structured data under CC0 1.0. No attribution is required; we give it anyway.
    terms_checked_on: 2026-11-22
    terms_urls:
      - https://www.wikidata.org/wiki/Wikidata:Licensing
      - https://www.mediawiki.org/wiki/Wikidata_Query_Service/User_Manual
      - https://foundation.wikimedia.org/wiki/Policy:Wikimedia_Foundation_User-Agent_Policy
    allowed_uses:
      - Read, transform and combine with other data (CC0, no conditions)
      - Show labels, descriptions, links and sitelink counts in the app
      - Keep raw and staged copies in our own bucket
    notes: >-
      Query Service limits as checked on the date above - 60 s per query, 60 s of processing per minute and
      5 parallel queries per IP, 429 with Retry-After beyond that, a descriptive User-Agent required. Only
      the direct instance-of classes in the CSV are matched (a subclass path took 55 s for one city).

  wikivoyage:
    name: Wikivoyage
    enabled: true
    url: https://en.wikivoyage.org/
    access: >-
      The English Wikivoyage monthly dump (https://dumps.wikimedia.org/enwikivoyage/latest/
      enwikivoyage-latest-pages-articles.xml.bz2, about 130 MB), downloaded once per run date with a
      User-Agent that names the app, checked against the published sha1, and parsed locally. Listings
      (see, do, eat, drink, sleep, buy and listing templates) are assigned to Trippr cities by their
      coordinates. Nothing is scraped from the live site.
    licence: CC-BY-SA-4.0
    licence_detail: >-
      Wikivoyage text is CC BY-SA 4.0 (some older text is also GFDL). Reusers must attribute Wikivoyage
      and its contributors, link to the licence, and release derived text under the same licence.
    licence_urls:
      - https://creativecommons.org/licenses/by-sa/4.0/
      - https://en.wikivoyage.org/wiki/Wikivoyage:Copyleft
    attribution: >-
      Text from Wikivoyage (en.wikivoyage.org) by its contributors, licensed under CC BY-SA 4.0
      (https://creativecommons.org/licenses/by-sa/4.0/).
    terms_checked_on: 2026-11-22
    terms_urls:
      - https://en.wikivoyage.org/wiki/Wikivoyage:Copyleft
      - https://dumps.wikimedia.org/legal.html
      - https://foundation.wikimedia.org/wiki/Policy:Wikimedia_Foundation_User-Agent_Policy
    allowed_uses:
      - Read and parse the dump; use listing facts (names, coordinates, websites, QIDs) like any open fact
      - Quote listing text (`content`) only with the attribution above, flagged as CC BY-SA in the data
      - Text-derived output (including AI summaries) is a derivative and stays CC BY-SA with attribution
    notes: >-
      The `content` field is kept apart from the facts and flagged description_licence = CC-BY-SA-4.0 in
      signals, so downstream steps can attribute it. Images are not taken.

  insideairbnb:
    name: Inside Airbnb
    enabled: true
    url: https://insideairbnb.com/get-the-data/
    access: >-
      Per-city snapshot files on https://data.insideairbnb.com/<country>/<region>/<city>/<snapshot date>/,
      found from the index page https://insideairbnb.com/get-the-data/ (read once per run). We download
      data/listings.csv.gz, data/calendar.csv.gz, visualisations/reviews.csv (the review dates summary),
      visualisations/neighbourhoods.csv and neighbourhoods.geojson for the cities in
      config/insideairbnb_cities.csv: one file at a time with a pause between requests, only when the
      snapshot is not already in raw/, with a generic User-Agent. The site's robots.txt only disallows
      ia_archiver. No account or key is needed. Nothing is taken from Airbnb itself.
    licence: CC-BY-4.0
    licence_urls:
      - https://creativecommons.org/licenses/by/4.0/
    attribution: >-
      Data from Inside Airbnb (insideairbnb.com), CC BY 4.0. Location and snapshot date are shown with
      every figure.
    terms_checked_on: 2026-11-23
    terms_urls:
      - https://insideairbnb.com/get-the-data/
      - https://insideairbnb.com/data-policies/
      - https://creativecommons.org/licenses/by/4.0/
    allowed_uses:
      - Aggregate (medians, counts, shares by area, neighbourhood and map cell) and show the aggregates with the attribution above
      - Keep the downloaded snapshot in our own private bucket for reproducibility
    notes: >-
      The Data Policies ask users to take only the data they need, not to scrape the site, to download
      once rather than on every run, and not to republish the data. So: raw and staged listing files stay
      private (the bucket blocks public access), only aggregates leave the pipeline (no listing ids, host
      ids, names, photos or links), and a snapshot already in raw/ is never fetched again. Coverage of
      Trippr's cities is Tokyo, Hong Kong, Singapore, Taipei and Bangkok only. Prices are quoted in each
      city's local currency with a "$" sign; they are converted to CAD at the Bank of Canada rate for the
      snapshot date.

  osm_lodging:
    name: OpenStreetMap lodging (tourism=hotel|hostel|guest_house|apartment|motel)
    enabled: true
    url: https://wiki.openstreetmap.org/wiki/Key:tourism
    access: >-
      Overpass API (https://overpass-api.de/api/interpreter), one query per city bounding box for
      nwr[tourism~"^(hotel|hostel|guest_house|apartment|motel)$"], run one at a time with a pause between
      queries and a generic User-Agent, as the Overpass usage policy asks. A stand-in until PR 2's full
      OpenStreetMap extractor lands, which will replace it.
    licence: ODbL-1.0
    licence_urls:
      - https://opendatacommons.org/licenses/odbl/1-0/
    attribution: © OpenStreetMap contributors, available under the Open Database Licence (openstreetmap.org/copyright).
    terms_checked_on: 2026-11-23
    terms_urls:
      - https://www.openstreetmap.org/copyright
      - https://wiki.openstreetmap.org/wiki/Overpass_API#Public_Overpass_API_instances
      - https://operations.osmfoundation.org/policies/api/
    allowed_uses:
      - Read, transform and combine with other data with attribution; a public database derived from it must be offered under ODbL
      - Keep OSM-derived fields traceable per record (sources) and do not publish the curated bundle as a dataset
    notes: >-
      Share-alike applies to a published derived database; the pipeline's outputs stay private and the app
      only shows attribution. See the spec's "Provenance and licences".

  boc_fx:
    name: Bank of Canada exchange rates (Valet API)
    enabled: true
    url: https://www.bankofcanada.ca/valet/docs
    access: >-
      https://www.bankofcanada.ca/valet/observations/<FX series>/json?start_date=..&end_date=.. (public, no
      key), one request per run for the currencies and dates needed. Series FX<CCY>CAD are daily averages in
      Canadian dollars per unit of the currency.
    licence: Bank of Canada Terms of Use (free use with attribution)
    licence_urls:
      - https://www.bankofcanada.ca/terms/
    attribution: Exchange rates from the Bank of Canada (bankofcanada.ca), daily average rates; converted prices are approximations.
    terms_checked_on: 2026-11-23
    terms_urls:
      - https://www.bankofcanada.ca/terms/
      - https://www.bankofcanada.ca/valet/docs
    allowed_uses:
      - Use, copy and distribute with attribution to the Bank of Canada and a note that changes were made
      - Keep requests few (the terms forbid circumventing request limits)
    notes: >-
      Used to convert Inside Airbnb prices to CAD at the snapshot date's rate (the last business day on or
      before the date).
