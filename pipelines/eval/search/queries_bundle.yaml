# Labelled search queries over the curated bundle's places.parquet (about 8,000 places in 108 cities, each
# with English and local names and, for about 60%, a Wikivoyage/Wikidata description).
#
#   uv run python -m trippr_data eval-search --corpus out/bundles/<date>/places.parquet \
#       --queries eval/search/queries_bundle.yaml
#
# Labels are rules over the bundle's columns, not place ids, so they survive a re-curation.
# kind: name         a well-known place asked for by one of its names, often in another script or
#                    romanisation than the record's primary name. Relevant = the record(s) with that
#                    English name in that city.
# kind: category     "temples in Kyoto" in six languages. Relevant = the places of that city and category.
# kind: intent       the same, phrased as what the traveller wants.
# kind: description  about what the place is, answered from its description text. Relevant = places whose
#                    description matches the regex (a trailing ~ on a field name means regex), so these
#                    labels are approximate: recall is understated, precision is fair.

queries:
