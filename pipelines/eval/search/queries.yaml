# Labelled search queries for `trippr-data eval-search` (see eval/search/README.md for how they were made).
#
# kind: name      a landmark by one of its names, often in a script other than the one in its records.
#                 Relevant = every corpus record for that landmark (`anchor` column of places.csv).
# kind: category  "temples in Kyoto" in six languages. Relevant = the corpus places of that city and
#                 taxonomy category (`match`).
# kind: intent    the same, phrased as what the traveller wants rather than the category's name.

queries:
  # ---- name queries -------------------------------------------------------------------------
  - {id: n-ja-sensoji, text: 浅草寺, lang: ja, kind: name, match: {anchor: sensoji}}
  - {id: n-en-sensoji, text: Sensoji temple Asakusa, lang: en, kind: name, match: {anchor: sensoji}}
  - {id: n-ko-sensoji, text: 센소지, lang: ko, kind: name, match: {anchor: sensoji}}
